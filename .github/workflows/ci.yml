name: Build and check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core and CLI checks
        run: ./scripts/test.sh
      - name: Package application
        run: TALLY_SKIP_BUILD=1 ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Tally-Island-macOS-preview
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
